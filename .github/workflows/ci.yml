name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Logic and packaging tests
        run: uv run --with "mcp>=2.3,<3" --with pytest pytest -q

  sources:
    # Cross-checks server.py against TIPO's original documents. Allowed to fail:
    # the TIPO site may be unreachable from GitHub runners, and a hash mismatch means
    # TIPO changed a document (read docs/SOURCES.md before touching server.py).
    name: source cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Fetch and hash-check TIPO documents
        run: python scripts/fetch_sources.py
      - name: Cross-check tests (PDF and OAS)
        run: uv run --with "mcp>=2.3,<3" --with pytest --with pypdf pytest -q -rs
