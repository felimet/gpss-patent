name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: python -m pip install --quiet uv
      # The TIPO source cross-check tests skip here: tiponet.tipo.gov.tw returned HTTP 403
      # to GitHub-hosted runners. Maintainers run them from Taiwan (see README, Verification).
      - name: Logic and packaging tests
        run: uv run --with "mcp>=2.3,<3" --with pytest pytest -q -rs
